<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rest &amp; Rounds</title>
<meta name="theme-color" content="#13161b">
<meta name="description" content="Rest & Rounds: a free gym rest and interval timer by Chunga Lab.">
<meta name="author" content="Chunga Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}</style>
<style>
/* Layout: one-column phone app — list of colour-coded timer cards, fixed bottom nav,
   full-screen run view with a big condensed countdown inside a progress ring.
   Deliberately dark-only: it's used under gym lights and between sets. */
:root {
  color-scheme: dark;
  --bg: #13161b;
  --surface: #1c2027;
  --surface-2: #252a33;
  --line: #2f3540;
  --fg: #eef1f5;
  --muted: #8d95a3;
  --brand: #ffc83d;          /* amber: active nav, primary buttons */
  --brand-ink: #1a1405;
  --danger: #ff5a5a;
  /* template stripe colours */
  --c-orange: #ff8a3d; --c-violet: #b65cf0; --c-amber: #ffc83d; --c-red: #ff4d5e;
  --c-green: #3ddc84; --c-blue: #3d9bff; --c-teal: #2fd3c4;
  --work: #3ddc84; --rest: #3d9bff; --prep: #ffc83d;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 18px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 18px 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; letter-spacing: 0.04em; text-transform: uppercase; margin: 0; }
.sub { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
.group-label { color: var(--muted); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; margin: 22px 2px 10px; }
.list { display: grid; gap: 12px; }

/* timer card */
.card {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px;
  background: var(--surface); border-radius: var(--radius); padding: 16px 8px 16px 22px; overflow: hidden;
  border: 1px solid transparent; cursor: pointer; text-align: left; width: 100%;
}
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--stripe); }
.card:hover { border-color: var(--line); }
.card-main { min-width: 0; }
.card-head { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.card-time { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; color: var(--stripe); font-variant-numeric: tabular-nums; flex: none; }
.card-name { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-desc { color: var(--muted); font-size: 0.95rem; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { background: none; border: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn svg { width: 22px; height: 22px; }
.fav-on { color: var(--c-red); }

/* quick rest chips */
.quick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.chip {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 4px; cursor: pointer;
  font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; font-variant-numeric: tabular-nums;
}
.chip:hover { border-color: var(--brand); }
.empty { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px; font-size: 0.95rem; line-height: 1.45; }
.btn {
  border: none; border-radius: 14px; padding: 14px 18px; font-weight: 600; cursor: pointer; min-height: 48px;
}
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-ghost { background: var(--surface-2); color: var(--fg); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-block { width: 100%; }

/* bottom nav */
nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
nav.bottom .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.nav-btn { background: none; border: none; cursor: pointer; display: grid; justify-items: center; gap: 4px; color: var(--muted); font-size: 0.85rem; padding: 4px 0; }
.nav-btn .pill { width: 64px; height: 34px; border-radius: 17px; display: grid; place-items: center; }
.nav-btn svg { width: 24px; height: 24px; }
.nav-btn[aria-current="page"] { color: var(--brand); }
.nav-btn[aria-current="page"] .pill { background: var(--brand); color: var(--brand-ink); }

/* settings */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--surface); border-radius: 14px; padding: 14px 16px; }
.set-row + .set-row { margin-top: 8px; }
.set-row .t { font-weight: 600; }
.set-row .d { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
.switch .track { position: absolute; inset: 0; border-radius: 15px; background: var(--surface-2); border: 1px solid var(--line); transition: background .15s; pointer-events: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.switch input:checked + .track { background: var(--brand); border-color: var(--brand); }
.switch input:checked + .track::after { transform: translateX(22px); background: var(--brand-ink); }
.switch input:focus-visible + .track { outline: 2px solid var(--brand); outline-offset: 2px; }
.seg { display: flex; gap: 6px; }
.seg button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }

/* sheet (menu + editor) */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); border-radius: 22px 22px 0 0; max-height: 92%; overflow-y: auto;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet h2 { font-family: var(--font-display); font-size: 1.6rem; text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 4px; }
.sheet .menu { display: grid; gap: 8px; margin-top: 14px; }
.sheet .menu .btn { text-align: left; }
.field { display: grid; gap: 6px; margin-top: 14px; }
.field label, .field .lbl { color: var(--muted); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.field input[type="text"], .field input[type="number"] {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: var(--fg); font: inherit; font-variant-numeric: tabular-nums;
}
.mmss { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.mmss span { color: var(--muted); font-family: var(--font-display); font-size: 1.4rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; background: var(--sw); }
.swatch[aria-pressed="true"] { border-color: var(--fg); }
.preview { color: var(--muted); font-size: 0.9rem; margin-top: 14px; }
.sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }

/* run view */
.run {
  position: fixed; inset: 0; z-index: 60; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background-image: radial-gradient(120% 70% at 50% 40%, color-mix(in srgb, var(--phase) 22%, transparent), transparent 70%);
  transition: background-color .3s;
}
.run-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 560px; width: 100%; margin: 0 auto; }
.run-title { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 0.04em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-mid { display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; }
.ring { position: relative; width: min(78vw, 46vh, 360px); aspect-ratio: 1; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .bgc { fill: none; stroke: var(--surface-2); stroke-width: 10; }
.ring .fgc { fill: none; stroke: var(--phase); stroke-width: 10; stroke-linecap: round; transition: stroke .3s; }
.ring-inner { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 2px; }
.phase { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--phase); }
.clock { font-family: var(--font-display); font-weight: 700; font-size: clamp(4.5rem, 22vw, 7.5rem); line-height: 0.95; font-variant-numeric: tabular-nums; }
.round { color: var(--muted); font-size: 1rem; font-variant-numeric: tabular-nums; }
.next { color: var(--muted); font-size: 0.95rem; min-height: 1.4em; }
.run-controls { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; max-width: 560px; width: 100%; margin: 0 auto; }
.run-controls .btn { font-family: var(--font-display); font-size: 1.25rem; letter-spacing: 0.04em; text-transform: uppercase; }
.adjust { display: flex; gap: 10px; justify-content: center; }
.adjust .btn { min-width: 84px; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div>
      <h1 id="pageTitle">My Timers</h1>
      <div class="sub" id="pageSub">Tap a timer to start it</div>
    </div>
    <button class="icon-btn" id="newBtn" aria-label="Create a timer" title="Create a timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>
  <main id="view"></main>
</div>

<nav class="bottom" aria-label="Sections">
  <div class="inner">
    <button class="nav-btn" data-tab="mine"><span class="pill"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.2 5 6.6 5c2 0 3.4 1.1 4.4 2.6C12 6.1 13.4 5 15.4 5c3.4 0 5.4 3.6 4.1 6.8C19.5 16.4 12 21 12 21z"/></svg></span>My Timers</button>
    <button class="nav-btn" data-tab="templates"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2h5"/></svg></span>Templates</button>
    <button class="nav-btn" data-tab="prefs"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>Settings</button>
  </div>
</nav>

<div id="layer"></div>

<script>
/* ---------- storage (per-browser, wrapped so a blocked store never breaks the app) ---------- */
const KEY = 'rest_rounds_v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

const COLORS = ['orange', 'violet', 'amber', 'red', 'green', 'blue', 'teal'];

/* Templates: work/rest in seconds, rounds, labels. kind 'rest' = a single rest countdown. */
const TEMPLATES = [
  { id: 't-quick', group: 'Strength', name: 'Quick Rest', desc: 'A 1-minute rest between sets.', color: 'orange', work: 60, rest: 0, rounds: 1, kind: 'rest' },
  { id: 't-standard', group: 'Strength', name: 'Standard Rest', desc: '90 seconds, for most working sets.', color: 'violet', work: 90, rest: 0, rounds: 1, kind: 'rest' },
  { id: 't-heavy', group: 'Strength', name: 'Heavy Rest', desc: '3 minutes for squats, bench and deadlifts.', color: 'amber', work: 180, rest: 0, rounds: 1, kind: 'rest' },
  { id: 't-upper', group: 'Strength', name: 'Upper Circuit', desc: '40s work, 20s rest, 12 rounds.', color: 'red', work: 40, rest: 20, rounds: 12 },
  { id: 't-lower', group: 'Strength', name: 'Lower Circuit', desc: '45s work, 15s rest, 12 rounds.', color: 'green', work: 45, rest: 15, rounds: 12 },
  { id: 't-tabata', group: 'HIIT & Cardio', name: 'Tabata', desc: '20s all-out, 10s rest, 8 rounds.', color: 'blue', work: 20, rest: 10, rounds: 8 },
  { id: 't-emom', group: 'HIIT & Cardio', name: 'EMOM 10', desc: 'Every minute on the minute, 10 minutes.', color: 'teal', work: 60, rest: 0, rounds: 10, workLabel: 'Minute' },
  { id: 't-amrap', group: 'HIIT & Cardio', name: 'AMRAP 12', desc: 'As many rounds as possible in 12 minutes.', color: 'orange', work: 720, rest: 0, rounds: 1, workLabel: 'AMRAP' },
  { id: 't-3030', group: 'HIIT & Cardio', name: '30 / 30 Intervals', desc: '30s hard, 30s easy, 10 rounds.', color: 'violet', work: 30, rest: 30, rounds: 10 },
  { id: 't-stretch', group: 'Mobility', name: 'Stretch Holds', desc: '30s holds with 5s to switch, 8 holds.', color: 'teal', work: 30, rest: 5, rounds: 8, workLabel: 'Hold', restLabel: 'Switch' },
  { id: 't-plank', group: 'Mobility', name: 'Plank Sets', desc: '60s hold, 60s rest, 3 sets.', color: 'green', work: 60, rest: 60, rounds: 3, workLabel: 'Hold' },
];

let store = load() || {
  favorites: ['t-quick', 't-standard', 't-heavy', 't-tabata'],
  custom: [],
  prefs: { sound: true, voice: true, vibrate: true, wake: true, prep: 5 },
  tab: 'mine',
};
store.prefs = Object.assign({ sound: true, voice: true, vibrate: true, wake: true, prep: 5 }, store.prefs || {});

/* ---------- helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = secs => { secs = Math.max(0, Math.round(secs)); const m = Math.floor(secs / 60), s = secs % 60; return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); };
const total = t => t.work * t.rounds + t.rest * Math.max(0, t.rounds - 1);
const colorVar = c => `var(--c-${COLORS.includes(c) ? c : 'amber'})`;
const allTimers = () => TEMPLATES.concat(store.custom);
const byId = id => allTimers().find(t => t.id === id);
const isCustom = t => t.id.startsWith('c-');

const ICON_MORE = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

function cardHTML(t) {
  return `<div class="card" role="button" tabindex="0" data-start="${esc(t.id)}" style="--stripe:${colorVar(t.color)}" aria-label="Start ${esc(t.name)}, ${fmt(total(t))}">
    <div class="card-main">
      <div class="card-head"><span class="card-time">${fmt(total(t))}</span><span class="card-name">${esc(t.name)}</span></div>
      <div class="card-desc">${esc(t.desc || describe(t))}</div>
    </div>
    <button class="icon-btn" data-menu="${esc(t.id)}" aria-label="Options for ${esc(t.name)}">${ICON_MORE}</button>
  </div>`;
}
function describe(t) {
  if (t.rounds === 1 && !t.rest) return `${fmt(t.work)} countdown.`;
  return `${t.work}s ${(t.workLabel || 'work').toLowerCase()}${t.rest ? `, ${t.rest}s ${(t.restLabel || 'rest').toLowerCase()}` : ''}, ${t.rounds} rounds.`;
}

/* ---------- views ---------- */
const CREDIT = `<p style="text-align:center;color:var(--muted);font-size:0.85rem;margin:28px 0 8px">Free by <a href="https://chungalab.github.io" target="_blank" rel="noopener" style="color:var(--muted)">Chunga Lab</a></p>`;
const TITLES = { mine: ['My Timers', 'Tap a timer to start it'], templates: ['Templates', 'Tap ⋯ to add one to My Timers'], prefs: ['Settings', 'Sound, voice and screen'] };

function render() {
  const tab = store.tab in TITLES ? store.tab : 'mine';
  $('#pageTitle').textContent = TITLES[tab][0];
  $('#pageSub').textContent = TITLES[tab][1];
  document.querySelectorAll('.nav-btn').forEach(b => b.toggleAttribute('aria-current', false) || (b.dataset.tab === tab && b.setAttribute('aria-current', 'page')));
  $('#newBtn').hidden = tab === 'prefs';
  const v = $('#view');
  if (tab === 'mine') {
    const favs = store.favorites.map(byId).filter(Boolean);
    const custom = store.custom.filter(t => !store.favorites.includes(t.id));
    const mine = favs.concat(custom);
    v.innerHTML = `
      <div class="group-label" style="margin-top:4px">Quick rest</div>
      <div class="quick">${[45, 60, 90, 120, 180].map(s => `<button class="chip" data-quick="${s}" aria-label="Start a ${fmt(s)} rest">${s < 60 ? s + 's' : fmt(s).replace(/^0/, '')}</button>`).join('')}</div>
      <div class="group-label">Saved</div>
      ${mine.length ? `<div class="list">${mine.map(cardHTML).join('')}</div>`
        : `<div class="empty">No saved timers yet. Open <strong>Templates</strong> and add the ones you use, or tap <strong>+</strong> to build your own.</div>`}`;
    v.innerHTML += CREDIT;
  } else if (tab === 'templates') {
    const groups = [...new Set(TEMPLATES.map(t => t.group))];
    v.innerHTML = groups.map(g => `<div class="group-label">${esc(g)}</div><div class="list">${TEMPLATES.filter(t => t.group === g).map(cardHTML).join('')}</div>`).join('') + CREDIT;
  } else {
    const p = store.prefs;
    const sw = (id, label, desc) => `<div class="set-row"><div><div class="t" id="${id}-l">${label}</div><div class="d">${desc}</div></div>
      <label class="switch"><input type="checkbox" id="${id}" data-pref="${id.replace('pref-', '')}" aria-labelledby="${id}-l" ${p[id.replace('pref-', '')] ? 'checked' : ''}><span class="track"></span></label></div>`;
    v.innerHTML = `
      ${sw('pref-sound', 'Beeps', '3-2-1 countdown and a tone when each phase changes')}
      ${sw('pref-voice', 'Voice', 'Calls out "Work", "Rest" and "Done"')}
      ${sw('pref-vibrate', 'Vibration', 'Buzz at each phase change (Android)')}
      ${sw('pref-wake', 'Keep screen on', 'Stops the phone sleeping while a timer runs')}
      <div class="set-row"><div><div class="t">Get-ready countdown</div><div class="d">Before interval timers start</div></div>
        <div class="seg" role="group" aria-label="Get-ready countdown">${[0, 5, 10].map(n => `<button data-prep="${n}" aria-pressed="${p.prep === n}">${n}s</button>`).join('')}</div></div>
      <div class="group-label">App</div>
      <div class="set-row"><div><div class="t">Install as an app</div><div class="d" id="installHelp">${window.rrStandalone ? 'Installed. You are using the app.' : 'Adds a Rest &amp; Rounds icon to your home screen.'}</div></div>
        ${window.rrStandalone ? '' : '<button class="btn btn-primary" id="installRow" style="min-height:40px;padding:8px 14px">Install</button>'}</div>
      <div class="set-row"><div><div class="t">Share with your gym mates</div><div class="d" id="shareHelp">chungalab.github.io/rest-and-rounds</div></div>
        <button class="btn btn-ghost" id="shareRow" style="min-height:40px;padding:8px 14px">Share</button></div>
      <div class="group-label">About</div>
      <div class="empty">
        <div style="color:var(--fg);font-weight:600;margin-bottom:4px">Rest &amp; Rounds · free, no sign-up, no ads</div>
        Built by <a href="https://chungalab.github.io" target="_blank" rel="noopener" style="color:var(--brand)">Chunga Lab</a>, so anyone can time their training without paying for a timer app.
        <div style="margin-top:10px">Timers and settings are saved on this phone. Beeps can't play while the phone is locked, so keep the screen on during a timer.</div>
      </div>`;
  }
}

/* ---------- sheets: menu + editor ---------- */
function closeLayer() { $('#layer').innerHTML = ''; }
function openSheet(html, onClick) {
  $('#layer').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim = $('#scrim');
  scrim.addEventListener('click', e => { if (e.target === scrim) closeLayer(); else onClick && onClick(e); });
  const first = scrim.querySelector('button, input'); if (first) first.focus();
}

function openMenu(id, confirmDelete = false) {
  const t = byId(id); if (!t) return;
  const fav = store.favorites.includes(id);
  openSheet(`
    <h2>${esc(t.name)}</h2><div class="sub">${fmt(total(t))} · ${esc(describe(t))}</div>
    <div class="menu">
      <button class="btn btn-primary" data-act="start">Start</button>
      ${isCustom(t) ? '' : `<button class="btn btn-ghost" data-act="fav">${fav ? 'Remove from My Timers' : 'Add to My Timers'}</button>`}
      <button class="btn btn-ghost" data-act="edit">${isCustom(t) ? 'Edit' : 'Copy and edit'}</button>
      ${isCustom(t) ? (confirmDelete
        ? `<button class="btn btn-danger" data-act="del-yes">Yes, delete ${esc(t.name)}</button>`
        : `<button class="btn btn-danger" data-act="del">Delete</button>`) : ''}
      <button class="btn btn-ghost" data-act="close">Cancel</button>
    </div>`, e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'start') { closeLayer(); startTimer(t); }
    if (act === 'fav') { store.favorites = fav ? store.favorites.filter(x => x !== id) : store.favorites.concat(id); persist(); closeLayer(); render(); }
    if (act === 'edit') openEditor(isCustom(t) ? t : Object.assign({}, t, { id: null, name: t.name + ' (mine)' }));
    if (act === 'del') openMenu(id, true);
    if (act === 'del-yes') { store.custom = store.custom.filter(x => x.id !== id); store.favorites = store.favorites.filter(x => x !== id); persist(); closeLayer(); render(); }
    if (act === 'close') closeLayer();
  });
}

function openEditor(t) {
  const d = t || { id: null, name: '', desc: '', color: 'orange', work: 60, rest: 0, rounds: 1 };
  let color = d.color;
  openSheet(`
    <h2>${d.id ? 'Edit timer' : 'New timer'}</h2>
    <div class="field"><label for="ed-name">Name</label><input type="text" id="ed-name" maxlength="28" placeholder="e.g. Bench rest" value="${esc(d.name)}"></div>
    <div class="field"><span class="lbl" id="ed-work-l">Work (or the countdown)</span>
      <div class="mmss"><input type="number" id="ed-wm" min="0" max="99" inputmode="numeric" aria-label="Work minutes" value="${Math.floor(d.work / 60)}"><span>:</span><input type="number" id="ed-ws" min="0" max="59" inputmode="numeric" aria-label="Work seconds" value="${d.work % 60}"></div></div>
    <div class="row2">
      <div class="field"><span class="lbl">Rest between rounds</span>
        <div class="mmss"><input type="number" id="ed-rm" min="0" max="99" inputmode="numeric" aria-label="Rest minutes" value="${Math.floor(d.rest / 60)}"><span>:</span><input type="number" id="ed-rs" min="0" max="59" inputmode="numeric" aria-label="Rest seconds" value="${d.rest % 60}"></div></div>
      <div class="field"><label for="ed-rounds">Rounds</label><input type="number" id="ed-rounds" min="1" max="99" inputmode="numeric" value="${d.rounds}"></div>
    </div>
    <div class="field"><span class="lbl">Colour</span><div class="swatches">${COLORS.map(c => `<button class="swatch" data-color="${c}" style="--sw:var(--c-${c})" aria-label="${c}" aria-pressed="${c === color}"></button>`).join('')}</div></div>
    <div class="preview" id="ed-preview"></div>
    <div class="sheet-actions"><button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="save">Save</button></div>`, e => {
    const sw = e.target.closest('[data-color]');
    if (sw) { color = sw.dataset.color; document.querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-pressed', b === sw)); }
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'cancel') closeLayer();
    if (act === 'save') {
      const v = read();
      if (v.work < 1) { $('#ed-preview').textContent = 'Set a work time of at least 1 second.'; return; }
      const rec = { id: d.id || 'c-' + Date.now().toString(36), name: v.name || 'My timer', desc: '', color, work: v.work, rest: v.rest, rounds: v.rounds,
        workLabel: d.workLabel, restLabel: d.restLabel, kind: v.rounds === 1 && !v.rest ? 'rest' : undefined };
      const i = store.custom.findIndex(x => x.id === rec.id);
      if (i >= 0) store.custom[i] = rec; else store.custom.push(rec);
      persist(); closeLayer(); store.tab = 'mine'; persist(); render();
    }
  });
  const n = (id, max) => Math.min(max, Math.max(0, parseInt($(id).value, 10) || 0));
  const read = () => ({ name: $('#ed-name').value.trim(), work: n('#ed-wm', 99) * 60 + n('#ed-ws', 59), rest: n('#ed-rm', 99) * 60 + n('#ed-rs', 59), rounds: Math.max(1, n('#ed-rounds', 99)) });
  const upd = () => { const v = read(); $('#ed-preview').textContent = `Total ${fmt(total(v))}${v.rounds > 1 ? ` · ${v.rounds} rounds` : ' · single countdown'}`; };
  $('#layer').addEventListener('input', upd); upd();
}

/* ---------- sound, voice, vibration, wake lock ---------- */
let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function tone(freq, dur, when = 0, vol = 0.22) {
  if (!store.prefs.sound || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + when;
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function say(text) {
  if (!store.prefs.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.05; speechSynthesis.speak(u); } catch (e) {}
}
function buzz(p) { if (store.prefs.vibrate) try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
let wakeLock = null;
async function wakeOn() { if (!store.prefs.wake) return; try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
function wakeOff() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && run && run.running) wakeOn(); });

/* ---------- timing engine (timestamp based, so it stays accurate if the tab is throttled) ---------- */
let run = null;
function buildSegments(t) {
  const segs = [];
  const prep = t.kind === 'rest' ? 0 : store.prefs.prep;
  if (prep > 0) segs.push({ kind: 'prep', label: 'Get ready', secs: prep, round: 0 });
  for (let r = 1; r <= t.rounds; r++) {
    segs.push({ kind: t.kind === 'rest' ? 'rest' : 'work', label: t.kind === 'rest' ? 'Rest' : (t.workLabel || 'Work'), secs: t.work, round: r });
    if (t.rest > 0 && r < t.rounds) segs.push({ kind: 'rest', label: t.restLabel || 'Rest', secs: t.rest, round: r });
  }
  return segs;
}
const PHASE_COLOR = { work: 'var(--work)', rest: 'var(--rest)', prep: 'var(--prep)', done: 'var(--brand)' };

function startTimer(t) {
  unlockAudio(); wakeOn();
  const segs = buildSegments(t);
  run = { t, segs, i: 0, end: performance.now() + segs[0].secs * 1000, left: null, running: true, beeped: {}, id: null };
  drawRun(); announce(segs[0]);
  run.id = setInterval(tick, 100);
}
function announce(seg) {
  if (seg.kind === 'work') { tone(1046, 0.35); say(seg.label === 'Work' ? 'Go' : seg.label); buzz([250]); }
  else if (seg.kind === 'rest') { tone(523, 0.45); say(seg.label); buzz([120, 80, 120]); }
  else { say('Get ready'); }
}
function remainingMs() { return run.running ? run.end - performance.now() : run.left; }
function tick() {
  if (!run || !run.running) return;
  let rem = remainingMs();
  while (rem <= 0) {
    if (run.i >= run.segs.length - 1) return finish();
    run.i++; const seg = run.segs[run.i];
    run.end += seg.secs * 1000; run.beeped = {};
    rem = run.end - performance.now();
    if (rem > 0) announce(seg);
  }
  const s = Math.ceil(rem / 1000);
  if (s <= 3 && s >= 1 && !run.beeped[s] && run.segs[run.i].secs > 3) { run.beeped[s] = true; tone(784, 0.12); }
  paint(rem);
}
function finish() {
  clearInterval(run.id); run.running = false; run.done = true;
  tone(1046, 0.18, 0); tone(1046, 0.18, 0.25); tone(1318, 0.5, 0.5); say('Done'); buzz([300, 100, 300]);
  wakeOff(); drawRun();
}
function stopRun() { if (run) clearInterval(run.id); run = null; wakeOff(); try { speechSynthesis.cancel(); } catch (e) {} closeLayer(); }
function togglePause() {
  if (!run || run.done) return;
  if (run.running) { run.left = run.end - performance.now(); run.running = false; wakeOff(); }
  else { unlockAudio(); run.end = performance.now() + run.left; run.running = true; wakeOn(); }
  drawRun();
}
function skip() {
  if (!run || run.done) return;
  if (run.i >= run.segs.length - 1) return finish();
  run.i++; const seg = run.segs[run.i];
  run.beeped = {};
  if (run.running) run.end = performance.now() + seg.secs * 1000; else run.left = seg.secs * 1000;
  announce(seg); drawRun();
}
function adjust(sec) {
  if (!run || run.done) return;
  if (run.running) run.end = Math.max(performance.now() + 1000, run.end + sec * 1000);
  else run.left = Math.max(1000, run.left + sec * 1000);
  paint(remainingMs());
}

const CIRC = 2 * Math.PI * 92;
function drawRun() {
  const t = run.t, seg = run.segs[run.i];
  const kind = run.done ? 'done' : seg.kind;
  const workRounds = t.rounds;
  const next = run.segs[run.i + 1];
  $('#layer').innerHTML = `
  <section class="run" style="--phase:${PHASE_COLOR[kind]}" aria-label="${esc(t.name)} running">
    <div class="run-top">
      <div class="run-title">${esc(t.name)}</div>
      <button class="icon-btn" data-run="stop" aria-label="Close timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="run-mid">
      <div class="ring">
        <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="bgc" cx="100" cy="100" r="92"/><circle class="fgc" id="arc" cx="100" cy="100" r="92" stroke-dasharray="${CIRC}" stroke-dashoffset="0"/></svg>
        <div class="ring-inner">
          <div class="phase">${run.done ? 'Done' : esc(seg.label)}</div>
          <div class="clock" id="clock" role="timer" aria-live="off">${run.done ? '00:00' : fmt(seg.secs)}</div>
          <div class="round">${run.done ? `${fmt(total(t))} complete` : (workRounds > 1 && seg.round ? `Round ${seg.round} of ${workRounds}` : '&nbsp;')}</div>
        </div>
      </div>
      <div class="next">${run.done ? 'Nice work.' : next ? `Next: ${esc(next.label)} ${fmt(next.secs)}` : 'Last one'}</div>
      ${!run.done && seg.kind === 'rest' ? `<div class="adjust"><button class="btn btn-ghost" data-run="minus">−15s</button><button class="btn btn-ghost" data-run="plus">+15s</button></div>` : ''}
    </div>
    <div class="run-controls">
      ${run.done
        ? `<button class="btn btn-ghost" data-run="stop">Close</button><button class="btn btn-primary" data-run="again">Again</button><span></span>`
        : `<button class="btn btn-ghost" data-run="stop">Stop</button><button class="btn btn-primary" data-run="pause">${run.running ? 'Pause' : 'Resume'}</button><button class="btn btn-ghost" data-run="skip">Skip</button>`}
    </div>
  </section>`;
  if (!run.done) paint(remainingMs()); else $('#arc').style.strokeDashoffset = 0;
}
function paint(rem) {
  const seg = run.segs[run.i], clock = $('#clock'), arc = $('#arc');
  if (!clock || !arc) return;
  clock.textContent = fmt(Math.ceil(Math.max(0, rem) / 1000));
  const frac = Math.min(1, Math.max(0, rem / (seg.secs * 1000)));
  arc.style.strokeDashoffset = String(CIRC * (1 - frac));
}

/* ---------- events ---------- */
document.querySelector('nav.bottom').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  store.tab = b.dataset.tab; persist(); render(); window.scrollTo(0, 0);
});
$('#newBtn').addEventListener('click', () => openEditor(null));
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'shareRow') {
    const url = 'https://chungalab.github.io/rest-and-rounds/';
    const text = 'Rest & Rounds: a free gym rest and interval timer by Chunga Lab. Install it from';
    const h = document.getElementById('shareHelp');
    if (navigator.share) { navigator.share({ title: 'Rest & Rounds', text, url }).catch(() => {}); }
    else if (navigator.clipboard) { navigator.clipboard.writeText(text + ' ' + url).then(() => { if (h) h.textContent = 'Link copied. Paste it in WhatsApp.'; }).catch(() => { if (h) h.textContent = url; }); }
  }
  if (e.target && e.target.id === 'installRow') {
    if (!(window.rrInstall && window.rrInstall())) {
      const h = document.getElementById('installHelp');
      if (h) h.textContent = 'Already installed, or Chrome needs a moment. Otherwise tap ⋮ (top right) → "Add to home screen" → Install.';
    }
  }
});
$('#view').addEventListener('click', e => {
  const menu = e.target.closest('[data-menu]');
  if (menu) { e.stopPropagation(); return openMenu(menu.dataset.menu); }
  const q = e.target.closest('[data-quick]');
  if (q) { const s = +q.dataset.quick; return startTimer({ id: 'q', name: `${fmt(s)} Rest`, work: s, rest: 0, rounds: 1, kind: 'rest', color: 'blue' }); }
  const card = e.target.closest('[data-start]');
  if (card) { const t = byId(card.dataset.start); if (t) startTimer(t); }
  const prep = e.target.closest('[data-prep]');
  if (prep) { store.prefs.prep = +prep.dataset.prep; persist(); render(); }
});
$('#view').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-start]')) { e.preventDefault(); e.target.click(); }
});
$('#view').addEventListener('change', e => {
  const k = e.target.dataset.pref; if (!k) return;
  store.prefs[k] = e.target.checked; persist();
  if (k === 'sound' && e.target.checked) { unlockAudio(); tone(880, 0.12); }
  if (k === 'voice' && e.target.checked) say('Voice on');
});
$('#layer').addEventListener('click', e => {
  const b = e.target.closest('[data-run]'); if (!b) return;
  const a = b.dataset.run;
  if (a === 'stop') stopRun();
  if (a === 'pause') togglePause();
  if (a === 'skip') skip();
  if (a === 'plus') adjust(15);
  if (a === 'minus') adjust(-15);
  if (a === 'again') { const t = run.t; stopRun(); startTimer(t); }
});
document.addEventListener('keydown', e => {
  if (!run) { if (e.key === 'Escape') closeLayer(); return; }
  if (e.key === ' ') { e.preventDefault(); togglePause(); }
  if (e.key === 'Escape') stopRun();
});

render();
</script>



<div id="installBar" hidden style="position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:70;max-width:528px;margin:0 auto;background:var(--surface-2);border:1px solid var(--brand);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px">
  <div style="min-width:0"><div style="font-weight:600">Install Rest &amp; Rounds</div><div style="color:var(--muted);font-size:0.85rem">Its own icon, full screen, works offline.</div></div>
  <div style="display:flex;gap:6px;flex:none"><button id="installLater" class="btn btn-ghost" style="min-height:40px;padding:8px 12px">Later</button><button id="installBtn" class="btn btn-primary" style="min-height:40px;padding:8px 14px">Install</button></div>
</div>
<script>
// Chrome fires beforeinstallprompt when the app can be installed: show our own button for it.
(function () {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let deferred = null;
  const bar = document.getElementById('installBar');
  const dismissed = () => { try { return localStorage.getItem('rr_install_later') === '1'; } catch (e) { return false; } };
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    if (!standalone && !dismissed()) bar.hidden = false;
    window.rrCanInstall = true;
  });
  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    try { await deferred.userChoice; } catch (e) {}
    deferred = null; bar.hidden = true;
  });
  document.getElementById('installLater').addEventListener('click', () => {
    bar.hidden = true; try { localStorage.setItem('rr_install_later', '1'); } catch (e) {}
  });
  window.addEventListener('appinstalled', () => { bar.hidden = true; });
  window.rrInstall = () => { if (deferred) { deferred.prompt(); deferred = null; bar.hidden = true; return true; } return false; };
  window.rrStandalone = standalone;
})();
</script>

<div id="updateBar" hidden style="position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600">
  <span>Update available</span><button id="updateBtn" class="btn" style="background:var(--brand-ink);color:var(--brand);min-height:40px;padding:8px 14px">Refresh</button>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const show = w => { document.getElementById('updateBar').hidden = false; document.getElementById('updateBtn').onclick = () => w.postMessage('skip'); };
    if (reg.waiting && navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) show(w); }); });
    setInterval(() => reg.update(), 60 * 60 * 1000);
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
}
</script>
